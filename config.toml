onboarding = false

[theme]
name = "terminal"
auto_switch = false

[ui]

status_indicators = "symbols"
tab_bar_position = "top"
hide_tab_bar_when_single_tab = false

[ui.toast]
delivery = "herdr"

[experimental]
allow_nested = true


[ui.sidebar.agents]
row_gap = 0
rows = [["$logo", { token = "agent", fg = "#888888", rules = [{ contains = "CoS", fg = "#ff5fa2", bold = true }, { contains = "-lead", fg = "#ff9f43" }] }], ["state_icon", "workspace", "tab"]]

# Brand colours from hhdebb/herdr-radar lib/palette.js; ink-only vendors keep the default.
[ui.sidebar.agents.rows_by_agent]
claude = [[{ token = "$logo", fg = "#d97757" }, { token = "agent", fg = "#888888", rules = [{ contains = "CoS", fg = "#ff5fa2", bold = true }, { contains = "-lead", fg = "#ff9f43" }] }], ["state_icon", "workspace", "tab"]]
