onboarding = false

[theme]
name = "terminal"
auto_switch = false

[ui]

status_indicators = "symbols"
tab_bar_position = "top"
hide_tab_bar_when_single_tab = false

[ui.toast]
delivery = "herdr"

[experimental]
allow_nested = true


[ui.sidebar.agents]
rows = [["state_icon", "$logo", { token = "$role_label", rules = [{ starts_with = "★", fg = "#e5c07b", bold = true }, { starts_with = "◆", fg = "#c678dd", bold = true }, { starts_with = "⚙", fg = "#56b6c2" }] }, "workspace", "tab"]]

# Brand colours from hhdebb/herdr-radar lib/palette.js; ink-only vendors keep the default.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", { token = "$logo", fg = "#d97757" }, { token = "$role_label", rules = [{ starts_with = "★", fg = "#e5c07b", bold = true }, { starts_with = "◆", fg = "#c678dd", bold = true }, { starts_with = "⚙", fg = "#56b6c2" }] }, "workspace", "tab"]]
