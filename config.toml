onboarding = false

[theme]
name = "terminal"
auto_switch = false

[ui]

status_indicators = "symbols"
tab_bar_position = "top"
hide_tab_bar_when_single_tab = false

[ui.toast]
delivery = "herdr"

[experimental]
allow_nested = true


[ui.sidebar.agents]
rows = [["state_icon", "$logo", "workspace", "tab"]]

# Brand colours from hhdebb/herdr-radar lib/palette.js; ink-only vendors keep the default.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", { token = "$logo", fg = "#d97757" }, "workspace", "tab"]]
gemini = [["state_icon", { token = "$logo", fg = "#4285f4" }, "workspace", "tab"]]
kimi = [["state_icon", { token = "$logo", fg = "#1783ff" }, "workspace", "tab"]]
qwen = [["state_icon", { token = "$logo", fg = "#615ced" }, "workspace", "tab"]]
kiro = [["state_icon", { token = "$logo", fg = "#9046ff" }, "workspace", "tab"]]
cline = [["state_icon", { token = "$logo", fg = "#586876" }, "workspace", "tab"]]
kilo = [["state_icon", { token = "$logo", fg = "#9a9808" }, "workspace", "tab"]]
