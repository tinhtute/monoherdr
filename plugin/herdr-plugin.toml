id = "monoherdr.agent-icons"
name = "monoherdr agent icons"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Publish each agent's logo glyph as the $logo sidebar token."
platforms = ["linux", "macos"]

[[startup]]
command = ["/usr/bin/python3", "-I", "icons.py"]

[[events]]
on = "pane.agent_detected"
command = ["/usr/bin/python3", "-I", "icons.py"]

# quaqua tags grid_role after detection; re-run so role pane name catches up.
[[events]]
on = "pane.agent_status_changed"
command = ["/usr/bin/python3", "-I", "icons.py"]

[[actions]]
id = "refresh"
title = "Agent icons: refresh"
description = "Re-publish the $logo and role pane name tokens on every agent pane."
command = ["/usr/bin/python3", "-I", "icons.py"]

[[actions]]
id = "clear"
title = "Agent icons: clear"
description = "Remove the $logo and role pane name tokens from every agent pane."
command = ["/usr/bin/python3", "-I", "icons.py", "--clear"]
